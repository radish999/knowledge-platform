    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ImageFit",
        "url": "https://www.goodbai.baby/",
        "description": "免费的在线图片压缩与尺寸调整工具，可指定文件大小、宽高及 JPG 或 WebP 输出格式。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and HTML5 Canvas support",
        "inLanguage": "zh-CN",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
        "featureList": ["图片压缩到指定 KB", "调整图片宽度和高度", "转换为 JPG 或 WebP", "浏览器本地处理图片"]
      }
    </script>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #172033; background: #f4f7fb; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: #f4f7fb; }
      .boot-topbar { height: 64px; display: flex; align-items: center; gap: 9px; padding: 0 max(18px, calc((100vw - 1120px) / 2)); background: #fff; border-bottom: 1px solid #e4e9f1; }
      .boot-logo { width: 32px; height: 32px; display: grid; place-items: center; color: #fff; background: #1769e0; border-radius: 7px; }
      .boot-logo svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .boot-brand { font-size: 19px; font-weight: 800; }
      .boot-chip { padding: 3px 6px; color: #1769e0; background: #eaf2ff; border-radius: 4px; font-size: 9px; font-weight: 800; }
      .boot-local { display: flex; align-items: center; gap: 7px; margin-left: auto; color: #3c6b55; font-size: 12px; font-weight: 650; }
      .boot-local::before { content: ''; width: 7px; height: 7px; background: #138a58; border-radius: 50%; }
      .boot-main { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 46px 0 54px; text-align: center; }
      .boot-eyebrow { margin: 0; color: #1769e0; font-size: 12px; font-weight: 750; }
      .boot-main h1 { margin: 12px 0; color: #111a2a; font-size: clamp(36px, 5vw, 56px); line-height: 1.08; letter-spacing: 0; }
      .boot-subtitle { margin: 0; color: #657087; font-size: 16px; line-height: 1.7; }
      .boot-upload { min-height: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 30px; background-color: #fff; background-image: linear-gradient(90deg, rgba(23,105,224,.035) 1px, transparent 1px), linear-gradient(rgba(23,105,224,.035) 1px, transparent 1px); background-size: 24px 24px; border: 1px dashed #aebed5; border-radius: 8px; box-shadow: 0 12px 32px rgba(28,44,73,.08); }
      .boot-upload-icon { width: 58px; height: 58px; display: grid; place-items: center; color: #1769e0; background: #eaf2ff; border-radius: 8px; }
      .boot-upload-icon svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .boot-upload strong { margin-top: 20px; font-size: 19px; }
      .boot-status { margin-top: 8px; color: #718097; font-size: 12px; }
      .boot-status::after { content: ''; display: inline-block; width: 5px; height: 5px; margin-left: 7px; vertical-align: 2px; background: #1769e0; border-radius: 50%; animation: boot-pulse 1s ease-in-out infinite alternate; }
      .boot-noscript { display: block; padding: 16px; color: #8b2c2c; background: #fff4f4; text-align: center; font-size: 13px; }
      @keyframes boot-pulse { to { opacity: .25; transform: scale(.75); } }
      @media (max-width: 600px) { .boot-local { font-size: 0; } .boot-local::before { width: 9px; height: 9px; } .boot-main { padding-top: 38px; } .boot-main h1 { font-size: 36px; } .boot-subtitle { font-size: 14px; } .boot-upload { min-height: 280px; } }
      @media (prefers-reduced-motion: reduce) { .boot-status::after { animation: none; } }
    </style>
    <title>ImageFit - 免费在线图片压缩与尺寸调整工具</title>
  </head>
  <body>
    <div id="root">
      <header class="boot-topbar">
        <span class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" /><path d="m6.5 17 4-4 2.5 2.5 2-2 2.5 3.5M16.5 8.5h.01" /></svg>
        </span>
        <strong class="boot-brand">ImageFit</strong>
        <span class="boot-chip">GOODBAI</span>
        <span class="boot-local">图片仅在浏览器本地处理</span>
      </header>
      <main class="boot-main">
        <p class="boot-eyebrow">ImageFit 图片上传合规助手</p>
        <h1>把照片处理成<br />网站要求的格式</h1>
        <p class="boot-subtitle">指定文件大小、尺寸和格式，一键生成可以上传的图片。</p>
        <div class="boot-upload" aria-busy="true" aria-label="正在加载图片工具">
          <span class="boot-upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg>
          </span>
          <strong>图片工具准备中</strong>
          <span class="boot-status">正在加载本地处理组件</span>
        </div>
      </main>
    </div>
    <noscript><span class="boot-noscript">ImageFit 需要启用 JavaScript 才能在浏览器本地处理图片。</span></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
